# Weekly, grouped dependency PRs with a 14-day cooldown: a version is a fortnight old before it is proposed
# (docs/maintainers/repository-design.md, "Dependency policy").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
