name: Bug
description: Something doesn't work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Never paste a real transcript, an API key or customer data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead (the error text, the report's line).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest task or suite file, config and command that show it. A run with the `scripted` adapter is ideal.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: '`npm ls @agent-evals/core`, and `node --version`'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
